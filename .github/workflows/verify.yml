name: Verify CareCycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Source and unit checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify failing tests propagate and produce diagnostics
        run: npm run test:failure-probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-diagnostics-${{ matrix.os }}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Isolated database workflow regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-diagnostics
          path: artifacts/logs/
          retention-days: 7

  browser:
    name: Isolated browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-diagnostics
          path: |
            artifacts/logs/
            artifacts/browser-results/
            artifacts/browser-report/
            artifacts/browser-results.xml
          retention-days: 7
